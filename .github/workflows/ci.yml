name: CI

# Every branch — feature-branch work has to be covered too, not just the default.
on:
  push:
    branches: ['**']
    tags-ignore: ['**']   # tags are the release workflow's job, and it runs the tests itself
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore RimManager.slnx

      - name: Build (Release, warnings as errors)
        run: dotnet build RimManager.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test RimManager.slnx --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=results.trx" --results-directory TestResults

      # Logs require sign-in; annotations do not. A red run must name its failing
      # tests where the API can see them, or every failure costs a round trip.
      - name: Surface failing tests
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          NS = '{http://microsoft.com/schemas/VisualStudio/TeamTest/2010}'
          for trx in glob.glob('TestResults/**/*.trx', recursive=True):
              with open(trx, encoding='utf-8', errors='replace') as fh:
                  text = fh.read()
              # VSTest never writes a DTD; a file carrying one is not a TRX we trust.
              if '<!DOCTYPE' in text[:2000]:
                  continue
              for r in ET.fromstring(text).iter(f'{NS}UnitTestResult'):
                  if r.get('outcome') == 'Failed':
                      name = r.get('testName', 'unknown')
                      m = r.find(f'.//{NS}Message')
                      msg = ' '.join(m.text.split())[:600] if m is not None and m.text else ''
                      print(f'::error title={name}::{msg}')
          PY
