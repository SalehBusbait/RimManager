name: CI

# Every branch — feature-branch work has to be covered too, not just the default.
on:
  push:
    branches: ['**']
    tags-ignore: ['**']   # tags are the release workflow's job, and it runs the tests itself
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore RimManager.slnx

      - name: Build (Release, warnings as errors)
        run: dotnet build RimManager.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test RimManager.slnx --configuration Release --no-build --verbosity normal
