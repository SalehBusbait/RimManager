name: Feature request
description: Something RimManager should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: >-
        What you are trying to do and where the app currently gets in the way.
        The problem is more useful than a prescribed solution.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How you imagine it working, if you have a picture in mind.
